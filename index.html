function viajar(lugar,alLlegar){const capa=document.createElement('div');capa.className='travel-overlay';capa.setAttribute('role','status');capa.setAttribute('aria-live','polite');capa.innerHTML=`<div class=travel-card><p class=travel-label>RECORRIENDO EL BARRIO</p><h2>En camino a<br>${lugar}</h2><div class=travel-road><div class=travel-walker>${PERSONA}</div></div><p class=travel-note>El equipo se mueve hacia la próxima parada…</p></div>`;$('#app').append(capa);setTimeout(()=>{capa.classList.add('leaving');setTimeout(()=>{capa.remove();alLlegar()},300)},2200)}

function mapa(n,parada,stop){const visitados=new Set();for(let i=0;i<n;i++)CAMINO[i].forEach(x=>visitados.add(mapKey(x.lugar)));CAMINO[n].slice(0,parada).forEach(x=>visitados.add(mapKey(x.lugar)));const actual=mapKey(stop.lugar);visitados.add(actual);const routeIndex=mapRoute.indexOf(actual),porId=Object.fromEntries(mapNodes.map(([id,label,x,y,g])=>[id,{id,label,x,y,g}])),coords=mapRoute.map(id=>porId[id]);const roads=coords.slice(0,-1).map((a,i)=>{const b=coords[i+1],tramo=i<routeIndex?`<line class="map-road-done" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`:'';return `<line class="map-road" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><line class="map-road-center" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>${tramo}`}).join('');const nodes=mapNodes.map(([id,label,x,y,g])=>{const state=id===actual?'current':visitados.has(id)?'done':'next',status=state==='current'?'AHORA':state==='done'?'VISITADO':'SIGUE';return `<g class="map-node ${state}">${state==='current'?`<circle class=map-halo cx="${x}" cy="${y}" r="17"/><text class=map-here x="${x}" y="${y-21}">AHORA</text>`:''}<rect x="${x-12}" y="${y-12}" width="24" height="24"/><text class=map-glyph x="${x}" y="${y+5}">${g}</text><text class=map-label x="${x}" y="${y+29}">${label}</text><text class=map-status x="${x}" y="${y+40}">${status}</text></g>`}).join('');return `<section class=map-panel><p class=map-heading><span>MAPA DEL BARRIO</span><small>${visitados.size}/${mapNodes.length} lugares recorridos</small></p><p class=map-current-label>ESTÁN EN: ${stop.lugar}</p><svg class=neighborhood-map viewBox="0 0 360 220" role=img aria-label="Mapa del barrio. Están en ${stop.lugar}"><rect x="1" y="1" width="358" height="218" fill="#202943" stroke="#343d62" stroke-width="2"/><path d="M5 83H355M5 163H355M95 4V216M201 4V216M294 4V216" stroke="#293450" stroke-width="2" stroke-dasharray="3 7"/>${roads}${nodes}</svg><div class=map-legend><span><i class="map-dot done"></i>Visitado</span><span><i class="map-dot current"></i>Ahora</span><span><i class=map-dot></i>Próximo</span></div></section>`}


function tone(freq,duration=.045,volume=.018,type='square'){if(!soundEnabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext=audioContext||new AC();if(audioContext.state==='suspended')audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain(),now=audioContext.currentTime;osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+duration)}
function musicTone(freq,duration,volume,type){tone(freq,duration,volume*(Date.now() < speechUntil ? 0.06 : 1),type)}
function startMusic(){if(!soundEnabled||musicTimer)return;const track=musicTracks[currentTrack];musicStep=0;musicTimer=setInterval(()=>{if(!soundEnabled){clearInterval(musicTimer);musicTimer=null;return}const step=musicStep%track.tune.length,note=track.tune[step],low=track.bass[step%track.bass.length];if(note)musicTone(note,track.dur,track.vol,track.lead);if(low)musicTone(low,track.lowDur,track.lowVol,track.low);if(track.arp&&step%8===4)musicTone(track.tune[(step+6)%track.tune.length]||392,.095,.0028,track.lead);musicStep++},track.tempo)}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function clickSfx(){tone(680,.045,.025);setTimeout(()=>tone(980,.055,.018),45)}
function speechSfx(lado){if(!soundEnabled)return;if(++speechTicks%2!==0)return;speechUntil=Date.now()+145;const base=(lado==='npc'?175:225)+Math.random()*28;tone(base,.055,.022,'triangle');setTimeout(()=>tone(base*1.32,.04,.012,'triangle'),42)}
document.addEventListener('click',e=>{if(e.target.closest('#sound-toggle')){soundEnabled=!soundEnabled;const b=$('#sound-toggle');b.textContent=soundEnabled?'🔊 SONIDO':'🔇 SILENCIO';b.setAttribute('aria-pressed',String(soundEnabled));if(soundEnabled){startMusic();clickSfx()}else stopMusic();return}if(e.target.closest('#music-toggle')){currentTrack=(currentTrack+1)%musicTracks.length;const b=$('#music-toggle');b.textContent='♫ '+musicTracks[currentTrack].name;if(soundEnabled){stopMusic();startMusic()}clickSfx();return}if(e.target.closest('button, .ops label, .ops span')){startMusic();clickSfx()}},true);

function personaje(x){if(x.lado==='player'||x.who==='EQUIPO INVESTIGADOR')return'investigador';const w=x.who.toLowerCase();if(w.includes('médica')||w.includes('medica'))return'medico';if(w.includes('administrativa'))return'administrativa';if(w.includes('trabajadora social'))return'social';if(w.includes('responsable del comedor'))return'comedor';if(w.includes('madre de tomás'))return'madre';if(w.includes('vecina que trabajó'))return'clinica';if(w.includes('vecina'))return'vecina';if(w.includes('sociedad de fomento')||w.includes('sociedad de fomento')||w.includes('referente')||w.includes('integrante'))return'referente';return'persona'}

function escribir(log,mensajes,alTerminar){let mi=0;function siguiente(){if(mi>=mensajes.length){alTerminar();return}const x=mensajes[mi++];log.insertAdjacentHTML('beforeend',dialogo(x));const fila=log.lastElementChild;fila.classList.add('talking');const typed=fila.querySelector('.typed'),cursor=fila.querySelector('.cursor'),chars=[...x.text];let i=0;function letra(){if(i<chars.length){const char=chars[i++];typed.textContent+=char;if(i%4===0)speechSfx(x.lado);if(i%12===0)log.scrollTop=log.scrollHeight;setTimeout(letra,40)}else{cursor.remove();fila.classList.remove('talking');if(x.src){const src=document.createElement('p');src.className='source';src.textContent='Fuente: '+x.src;fila.querySelector('.bubble').append(src)}setTimeout(siguiente,180)}}letra()}siguiente()}
function mostrarParada(bienvenida=true){const stop=stops[parada],final=parada===stops.length-1,limite=Math.min(2,stop.qs.length);const charla=bienvenida?[{lado:'player',who:'EQUIPO INVESTIGADOR',text:'Estamos reconstruyendo el caso de Tomás. ¿Podemos hacerte unas preguntas?'},{lado:'npc',who:stop.who,text:stop.intro}]:[{lado:'player',who:'EQUIPO INVESTIGADOR',text:'¿Qué otra cosa necesitamos saber?'}];

const A={q:'Según estas normas, ¿cómo debería haber actuado el Estado antes de que Tomás llegara grave?',m:1,o:[['Garantizar controles y atención primaria cerca del barrio',1],['Asegurar agua potable en el barrio',1],['Sumar pediatra y ambulancia',1],['Acompañar a la familia con asistencia y educación para la salud',1],['Esperar a que cada familia lleve a los chicos al hospital',-1],['Que cada familia busque atención privada',-1]],e:'Las cuatro primeras son obligaciones del Estado según las normas que acaban de leer. Las otras dos trasladan la responsabilidad a las familias.'};
const H={q:'¿Cómo debería haber actuado el hospital?',m:1,o:[['Atenderlo sin cobrar, por ser un hospital público y gratuito',1],['Articular con la salita y el barrio para el seguimiento',1],['Dar educación para la salud a la familia',1],['Culpar a la madre y derivarla a una clínica privada',-1],['Dar el alta apenas mejore, sin seguimiento',-1]],e:'El hospital público es gratuito y también tiene funciones de asistencia y educación para la salud. Culpar a la familia o cortar el seguimiento deja el problema sin resolver.'};
const F={q:'¿Qué falencias tuvo el Estado?',m:1,o:[['La salita no tiene pediatra, atiende pocas mañanas y no hay derivación ni seguimiento',2],['El barrio no tiene agua potable y la ambulancia tarda más de una hora',2],['Los pedidos del barrio no tuvieron respuesta y los niveles del Estado se pasan la responsabilidad',2],['No hay acompañamiento para una familia sin contrato ni obra social',2],['La familia no supo cuidar a su hijo',-2],['El hospital le cobró la consulta',-2]],e:'Las cuatro primeras surgen de las pistas y de los testimonios. Las otras no tienen respaldo: culpar a la familia o inventar un cobro no explica lo que pasó.'};
const I=[[A,H],[Q[0]],[Q[1]],[F,Q[2]]];
const nz=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const lock=()=>document.querySelectorAll('input').forEach(i=>i.disabled=true);
function ronda(){app(`<p class=k>Ronda de testimonios</p><h2>${R[S.r][0]}</h2><div class=doc>${R[S.r][1]}</div><p>Este testimonio es solo de ustedes: no muestren la pantalla. Cuéntenlo en voz alta a los demás grupos y averigüen los otros cinco hablando con ellos.</p><button class=btn id=ok>Ya hablamos con todos</button>`);$('#ok').onclick=cruce}
function cruce(){app(`<p class=k>Preguntas de cruce</p><h2>¿Qué dijeron los testigos?</h2>${CR.map((c,i)=>`<div class="af q"><p>${c[0]}</p>${c[1].map((o,j)=>`<label><input type=radio name=c${i} value=${j}>${o}</label>`).join('')}<p class=fb id=c${i}></p></div>`).join('')}<button class=btn id=ok>Confirmar respuestas</button>`);
let d=0;$('#ok').onclick=()=>{if(d){etapa(0);return}S.c=0;CR.forEach((c,i)=>{const v=document.querySelector(`input[name=c${i}]:checked`),g=v&&+v.value==c[2];if(g)S.c+=2;$('#c'+i).innerHTML=g?'<b class=ok>Correcto (+2).</b>':'<b class=no>Era: '+c[1][c[2]]+'.</b>'});lock();d=1;$('#ok').textContent='Continuar'}}
function etapa(i){if(i==4){blk([Q[3]],audiencia,'Cierre');return}llave(i,()=>blk(I[i],()=>etapa(i+1),'Instancia '+(i+1)+' de 4'),()=>etapa(i+1))}
function llave(i,nx,skip){const k=K[i];let n=0,fallo=false;
app(`<p class=k>Llave ${i+1} de 4</p><h2>Consigan la norma</h2><div class=doc>${k[0]}</div><input type=text id=ky autocomplete=off><p class=fb id=kf></p><button class=btn id=ok>Probar llave</button>`);
$('#ok').onclick=()=>{if(n<0){fallo?skip():nx();return}const a=nz($('#ky').value),f=$('#kf');if(!a)return;n++;const ok=k[1].includes(a);
if(ok||n>=3){fallo=!ok;S.kp[i]=ok?(n==1?2:n==2?1:0):0;f.innerHTML=(ok?`<b class=ok>Llave abierta (+${S.kp[i]}).</b>`:`<b class=no>Se agotaron los intentos. Esta instancia queda sin resolver y suma 0 puntos.</b>`)+`<br>Respuesta: ${k[1][0].toLowerCase()}. ${k[3]}`;$('#ky').disabled=true;$('#ok').textContent=ok?'Abrir la instancia':'Perder esta oportunidad y continuar';n=-1}
else f.innerHTML=`<b class=no>No es esa. Intento ${n} de 3.</b> ${n>1?k[2]:''}`}}
function blk(qs,nx,tt){app(`<p class=k>${tt}</p><h2>Respondan con lo que aprendieron</h2>${qs.map((q,i)=>`<div class="af q"><p>${q.q}</p>${q.o.map((o,j)=>`<label><input type=${q.m?'checkbox':'radio'} name=q${i} value=${j}>${o[0]}</label>`).join('')}<p class=fb id=e${i}></p></div>`).join('')}<button class=btn id=ok>Confirmar respuestas</button>`);
let d=0;$('#ok').onclick=()=>{if(d){nx();return}qs.forEach((q,i)=>{let s=0;document.querySelectorAll(`input[name=q${i}]:checked`).forEach(c=>s+=q.o[c.value][1]);s=Math.max(0,s);S.q+=s;$('#e'+i).innerHTML=`<b>+${s} puntos.</b> ${q.e}`});lock();d=1;$('#ok').textContent='Continuar'}}
const MEDIDAS=['Sumar un pediatra y ampliar los días de atención en la salita.','Crear un sistema de derivación y seguimiento entre la salita y el hospital.','Mejorar la respuesta de ambulancias para el barrio.','Garantizar agua potable y controles de calidad en los pozos.','Acordar responsabilidades y plazos entre municipio y Provincia.','Acompañar a las familias con asistencia y educación para la salud.'];
function audiencia(){app(`<p class=k>Audiencia del barrio · decisión final</p><h2>¿Qué debería cambiar?</h2><div class=doc>Elijan tres medidas para presentar en una audiencia. No hay una única combinación correcta: preparen argumentos con las pistas, los testimonios y las normas que investigaron.</div><p><b>Elijan tres prioridades:</b></p>${MEDIDAS.map((m,i)=>`<label class="q"><input type=checkbox name=med value=${i}> ${m}</label>`).join('')}<label for=arg>Escriban una justificación breve: ¿qué evidencia respalda su prioridad y a quién ayudaría?</label><textarea id=arg rows=4 maxlength=360 style="font:26px VT323,monospace;padding:10px;border:4px solid #000;box-shadow:0 0 0 4px var(--ed);width:100%;background:#0a0c1c;color:var(--p)"></textarea><p class=fb id=af></p><button class=btn id=ok>Preparar informe</button>`);
$('#ok').onclick=()=>{const ms=[...document.querySelectorAll('input[name=med]:checked')].map(x=>+x.value),arg=$('#arg').value.trim();if(ms.length!==3){$('#af').textContent='Elijan exactamente tres medidas para continuar.';return}if(arg.length<20){$('#af').textContent='Agreguen una justificación de al menos una oración.';$('#arg').focus();return}S.med=ms;S.arg=arg;fin()}}
function fin(){const a=S.pp.reduce((x,y)=>x+y,0),b=S.kp.reduce((x,y)=>x+y,0);S.t=a+b+S.c+S.q;const ms=S.med.map(i=>i+1).join(''),c=`${S.n}-${S.t}-${ms}-${ck(S.n,S.t+ms)}`;
app(`<p class=k>Grupo ${esc(S.n)} · audiencia del barrio</p><h2>Informe listo para presentar</h2><div class=doc><b>Prioridades elegidas</b><ol>${(S.med||[]).map(i=>`<li>${MEDIDAS[i]}</li>`).join('')}</ol><b>Fundamentación</b><p>${esc(S.arg||'')}</p></div><p>Presenten este informe en voz alta en un minuto. Citen al menos una pista o testimonio y expliquen por qué las medidas elegidas ayudarían a que otros chicos no lleguen a la guardia en la misma situación.</p><p class=big>${S.t}<span class=k> / ${MAX} puntos</span></p>
<p>Pistas: ${a} de 40 · Llaves: ${b} de 8 · Testimonios: ${S.c} de 12 · Instancias: ${S.q} de 39</p>
<p>Entreguen este código al docente. Incluye sus tres propuestas:</p><div class=code>${esc(c)}</div>`)}

const SL=[['El caso','Tomás, 9 años, barrio Las Retamas. ¿Fue mala suerte, descuido de la familia o hubo algo más?'],
['1853','La Constitución original no menciona el derecho a la salud. Se lo consideraba un asunto individual.'],
['1949','La reforma incorpora el derecho a la preservación de la salud y el Estado construye grandes hospitales.'],
['1955','El golpe anula la reforma de 1949 y el derecho queda sin reconocimiento constitucional.'],
['1994','La reforma incorpora el art. 41 (ambiente sano) y los tratados de derechos humanos (art. 75 inc. 22). El Estado pasa a ser garante.'],

['Para pensar','Si el Estado es garante, ¿qué pasa cuando la salita atiende tres mañanas por semana?']];
const G={};
function docente(){document.body.classList.add('t');let k=0,tm;
const lst=()=>{if(Object.keys(G).length)$('#ls').textContent='Cargados ('+Object.keys(G).length+'): '+Object.keys(G).join(', ')};
app(`<h1>Panel docente</h1><form id=fm style="display:flex;gap:12px;align-items:center"><input type=text id=cd placeholder="NOMBRE-52-135-K" autocomplete=off autocapitalize=characters><button class=btn style="margin:0">Cargar</button></form>
<p id=st class=k>Escriban el código de cada grupo y presionen Cargar.</p><p id=ls></p><div class=doc style="font-size:21px">Roles para repartir: ${R.map((r,i)=>(i+1)+". "+r[0]).join(" · ")}</div><button class=btn id=res>Mostrar resultados</button><div class=sl id=sl></div>`);lst();
const show=()=>{const s=SL[k%SL.length];$('#sl').innerHTML=`<h2>${s[0]}</h2><p>${s[1]}</p>${s[2]?`<img src="${s[2]}" alt="">`:''}`;k++};
show();tm=setInterval(show,14000);
$('#fm').onsubmit=e=>{e.preventDefault();const st=$('#st'),m=$('#cd').value.toUpperCase().replace(/[\u2010-\u2015\u2212]/g,'-').replace(/\s*-\s*/g,'-').trim().match(/^(.+)-(\d+)-([1-6]{3})-([A-Z])$/);
if(!m||new Set(m[3]).size!==3){st.textContent='Formato esperado: NOMBRE-PUNTOS-123-LETRA (los tres dígitos representan las propuestas).';st.className='k no';return}
if(ck(m[1],m[2]+m[3])!=m[4]||+m[2]>MAX){st.textContent='El código no coincide con el nombre, puntaje y propuestas. Revisen cómo está escrito.';st.className='k no';return}
G[m[1]]={score:+m[2],med:[...m[3]].map(Number)};$('#cd').value='';st.textContent='Código cargado: '+m[1]+' ('+m[2]+' puntos).';st.className='k ok';lst()};
$('#res').onclick=()=>{const r=Object.entries(G).sort((a,b)=>b[1].score-a[1].score);
if(!r.length){$('#st').textContent='Todavía no hay códigos cargados.';$('#st').className='k no';return}
clearInterval(tm);const d=r.length>1?r[0][1].score-r[1][1].score:0;
app(`<h1>Resultados</h1>${r.map((x,i)=>`<div class="row ${i?'':'w'}"><b>${esc(x[0])}</b><i style="width:${x[1].score/MAX*55}%"></i>${x[1].score}</div><div class=doc><b>Propuestas de ${esc(x[0])}:</b><ol>${x[1].med.map(m=>`<li>${MEDIDAS[m-1]}</li>`).join('')}</ol></div>`).join('')}
<h2>${r.length>1&&d?`Ganó ${esc(r[0][0])}, con ${d} ${d==1?'punto':'puntos'} de diferencia.`:r.length>1?'Hay empate en el primer puesto.':'Falta cargar más grupos.'}</h2>
<button class="btn alt" id=bk>Volver</button>`);$('#bk').onclick=docente}}

location.hash=='#docente'?docente():home();
